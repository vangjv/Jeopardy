<div class="board-container">
  <!-- Connection status indicator (T060) -->
  <div class="connection-status" [class.connected]="connectionStatus() === 'connected'" 
       [class.disconnected]="connectionStatus() === 'disconnected'"
       [class.connecting]="connectionStatus() === 'connecting'">
    @if (connectionStatus() === 'connected') {
      <span class="status-icon">●</span> Connected
    } @else if (connectionStatus() === 'disconnected') {
      <span class="status-icon">●</span> Disconnected - Refresh to reconnect
    } @else {
      <span class="status-icon">●</span> Connecting...
    }
  </div>

  <!-- Show clue display when a clue is active -->
  @if (showClue()) {
    <app-clue-display></app-clue-display>
  } @else {
    <!-- Show clue board when no clue is active -->
    <app-clue-board></app-clue-board>
  }

  <!-- Score display always visible at bottom -->
  <app-score-display></app-score-display>

  <!-- Buzz indicator overlay when player buzzes -->
  <app-buzz-indicator></app-buzz-indicator>
</div>
