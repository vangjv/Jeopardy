<div class="score-display">
  @for (player of players(); track player.id) {
    <div class="player-score">
      <div class="player-name">{{ player.name }}</div>
      <div class="score" [class]="getScoreClass(player.score)">
        {{ formatScore(player.score) }}
      </div>
    </div>
  }
</div>
