<div class="host-container">
  <mat-toolbar color="primary" class="host-toolbar">
    <span>Jeopardy Host Console</span>
    <span class="toolbar-spacer"></span>
    <button mat-raised-button (click)="openBoard()">
      <mat-icon>open_in_new</mat-icon>
      Open Board Display
    </button>
    <button mat-raised-button color="accent" (click)="startGame()">
      <mat-icon>play_arrow</mat-icon>
      Start Game
    </button>
  </mat-toolbar>

  <div class="host-content">
    <div class="left-column">
      <app-player-setup></app-player-setup>
      <app-game-import></app-game-import>

      <!-- T082: Round transition controls -->
      <mat-card class="round-controls">
        <mat-card-header>
          <mat-card-title>Round Controls</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="round-buttons">
            <button mat-raised-button color="primary" (click)="startRound1()">
              <mat-icon>looks_one</mat-icon>
              Start Round 1
            </button>
            <button mat-raised-button color="primary" (click)="startRound2()">
              <mat-icon>looks_two</mat-icon>
              Start Round 2
            </button>
            <button mat-raised-button color="accent" (click)="advanceRound()" [disabled]="!isRoundComplete()">
              <mat-icon>skip_next</mat-icon>
              Advance Round
            </button>
          </div>
          @if (isRoundComplete()) {
            <p class="round-complete-message">Round complete! Ready to advance.</p>
          }
        </mat-card-content>
      </mat-card>

      <app-daily-double-wager></app-daily-double-wager>
      <app-final-jeopardy></app-final-jeopardy>
      <app-game-rules></app-game-rules>
      <app-buzzer-panel></app-buzzer-panel>
      <app-score-adjudication></app-score-adjudication>
    </div>

    <div class="right-column">
      <app-game-board-control></app-game-board-control>
    </div>
  </div>
</div>
